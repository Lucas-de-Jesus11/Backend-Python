<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Produtos</title>
</head>
<body>
    <h1>Lista de Produtos</h1>
    {% for i in produtos %}
    <div>
        <img src="{{url_for('static', path='uploads/'+ i.imagem)}}" width="80">
        <h3>{{i.nome}}</h3>
        <p>Preço: R$ {{i.preo}} </p>

        <form action="/carrinho/adicionar/{i.id}" method="post">
            <input type="number" name="quantidade" value="1" min="1">
            <button type="submit">Adicionar ao carrinhho</button>
        </form>
    </div>
    {% endfor %}
    <a href="/carrinho">Ver Carrinho</a>
</body>
</html>
